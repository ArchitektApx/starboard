name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: scripts/package.sh
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: Starboard.zip
          generate_release_notes: true
